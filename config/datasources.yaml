# 数据源连接（密码走环境变量，不入库）

erp:
  host: 10.0.0.0
  port: 3306
  user: app_db
  password_env: ERP_PASSWORD
  database: app_db
  charset: utf8mb4
  timezone: "+08:00"
  write_timeout_seconds: 30
  auto_write: true                    # ERP_AUTO_WRITE
  tables:
    decision_config: t_advert_agent_decision_config
    decision: t_advert_agent_decision
    direction_recommend: t_advert_agent_direction_recommend
    purpose_score: t_advert_agent_purpose_score

starrocks:
  host: 10.0.0.0
  port: 9030
  user: cbr
  password_env: STARROCKS_PASSWORD
  database: app_db
  role: fallback                      # DATA_SOURCE=mcp → 优先 MCP，失败降级
  fetch_timeout_seconds: 180
  tables:
    shop_dim: dwd_shop                # id ↔ account 映射

state:
  host: 127.0.0.1
  port: 3307
  user: ad_agent
  password_env: STATE_PASSWORD
  database: app_db
