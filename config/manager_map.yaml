# 主管 → 下属映射
# key   = 主管 user_id（sys_user.id）
# value = 下属 user_id 列表
#
# 主管登录后，工作台里可以切换到"以下属身份"查看该下属的任务池。
# 空列表仍表示该用户是主管，只是当前尚未配置可查看的下属。
# 修改后重启服务生效。
#
# user_id 必须由 MySQL 权威人员表或正式身份服务提供，不得查询旧 SQLite。

