    输入:
      过去7天日均销量: 20
      近3天日均销量: 5
      连续天数: 5
    预期严重度: S0

  # 库存积压交叉
  - 场景: 库存积压_A预警B不预警_降档
    专项: 库存积压
    输入:
      可售库存: 1000
      近30天日均销量: 8            # 可售天数 = 125（S0）
      未来2月目标累计: 1500        # B 档：1000/750=1.33 月 → 不预警
    预期严重度: S1                 # S0 降一档

  - 场景: 库存积压_双预警_取高
