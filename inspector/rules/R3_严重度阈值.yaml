# =============================================================================
# R3 · 严重度阈值（Severity Grading Thresholds）
# =============================================================================
# 来源：docs/业务巡检Agent-代码实现版.md 模块 3（§3.1–§3.14）
# 版本：2026-07-28 · v4
#
# 【业务边界】
# 本文件只管"把命中的异常映射为 S0/S1/S2"，不管：
#   - 异常识别（→ R2_异常字典.yaml）
#   - 打分与优先级（→ R4_打分参数.yaml）
#   - 数据获取（→ data/sync/*）
#   - 处理建议（→ R6_处理建议.yaml）
#
# 【输入契约】给 inspector/engine/severity_grader.py 三种输入：
#   1. 固定严重度点位（§3.3）：直接查表返回 S0/S1/S2
#   2. 专项判定点位（§3.6-3.14）：传入该点位所需的所有基线+当前值+连续天数
#   3. 共因上调（§3.3.1）：传入初判 S + 共因数 → 返回上调后的 S
#
# 【输出契约】
#   - 正式严重度 S0 | S1 | S2   → 进入 R4 打分
#   - 观察类结果（数据不足/样本不足观察）→ 不打分、只标记
#
# 【维护约定】
#   - 所有阈值集中在本文件，改数字不改代码
#   - 分档表统一结构：{名称, 严重度|null, 下限, 上限}
#     · 名称=不预警时 严重度为 null（不产出正式异常）
#     · 下限含、上限不含（区间为 [下限, 上限)）；null 代表 ±∞
#   - 严重度取值仅限 S0/S1/S2，非预警时为 null
#   - 数据不足场景一律返回观察类结果，绝不猜、绝不填默认值
# =============================================================================

版本: "2026-07-28-v4"
说明: "初始建议值，需数据回流后校准。改动需同步更新 docs/业务巡检Agent-代码实现版.md"

# =============================================================================
# §3.3 各类异常严重度判定表（固定严重度点位）
# =============================================================================
# 用法：非专项类点位命中后直接查此表 → 返回默认 S 档
# 专项类点位（销量/ACOS/花费/目标/自然/卡位/转化率/评分/退款/库存积压/滞销）
# 在此表标注 "见 §X.Y"，判定走对应专项。
默认严重度表:
  # ---- 2.1 链接状态 ----
  链接不可售: S0
  变体掉线: S0
  父子体关系异常: S0
  Buy Box丢失: S0

  # ---- 2.2 内容完整性 ----
  主图异常: S0
  标题异常: S0
  五点异常: S1
  图片异常: S1
  A+异常: S2

  # ---- 2.3 价格与促销 ----
  变体价差异常: S1
  促销异常: S1

  # ---- 2.4 库存与可售 ----
  FBA可售库存为0: S0
  库存不足: S0
  库存积压: 见§3.13
  滞销异常: 见§3.14

  # ---- 2.5 交易表现 ----
  链接转化率异常下降: 见§3.10
  销量异常: 见§3.6
  销量增长提示: 见§3.6
  ACOS异常: 见§3.6
  广告花费异常: 见§3.6
  目标偏离: 见§3.7
  自然流量异常: 见§3.8
  卡位异常: 见§3.9
  放量未执行: S1     # §3.12 只要条件满足即 S1

  # ---- 2.6 合规与属性 ----
  合规异常: S0
  类目异常: S1
  属性信息异常: S1

  # ---- 2.7 售后 ----
  近期集中差评: S1   # §2.7 量化触发即 S1；不进 §3.11 专项分级
  评分异常: 见§3.11
  退款异常: 见§3.11

# =============================================================================
# §3.3.1 共因严重度上调规则
# =============================================================================
# 规则：某固定严重度点位被查因确认是 ≥3 个表现型异常的共同真实原因
#       → 严重度在初判基础上上调一档（S2→S1、S1→S0；S0 封顶）
# 计入共因计数的层级匹配：链接级正常计入；变体级仅"主要色/核心成交变体"计入
共因严重度上调:
  阈值_最少共因数: 3
  封顶: S0
  # 适用点位清单（§3.3.1，共 7 个；已 S0 封顶的点位不适用）
  适用点位:
    - 图片异常
    - 五点异常
    - A+异常
    - 变体价差异常
    - 促销异常
    - 类目异常
    - 属性信息异常
  # 层级匹配规则（详见 §3.3.1）
  层级规则:
    链接级根因: 正常计入父体级表现型异常的共因计数
    变体级根因_主要色: 计入
    变体级根因_次要色: 不计入
    变体级根因_长尾色: 不计入
  共因归属唯一性: true   # 同一表现型异常只能归属一个根因，避免重复计数

# =============================================================================
# §3.4 数据不足 / 样本不足 / 不触发正式异常
# =============================================================================
# 全局兜底：任一场景发生 → 返回观察类结果，不进入打分
数据不足规则:
  缺关键字段: "不输出正式 S 档，输出'数据不足/待补充'并列明缺失字段"
  样本量不足: "不输出正式 S 档，输出'样本不足观察'"
  外部数据缺失: "不阻断内部判定，只影响外部原因查证"
  # §3.4 新品经营判断豁免规则（父ASIN维度）
  新品豁免:
    触发条件:
      - "产品处于新品阶段"
      - "近3天父ASIN汇总广告花费 均 < 10 USD"
      - "父ASIN汇总可售库存 = 0"
    豁免点位:
      - 销量异常
      - ACOS异常
      - 广告花费异常
      - 目标偏离
      - 自然流量异常
      - 卡位异常
      - 放量未执行
      - 库存不足
      - 库存积压
      - 滞销异常
    不豁免点位: [链接转化率异常下降, 评分异常, 退款异常, 近期集中差评]

# =============================================================================
# §3.5 子体判定 → 父卡归集
# =============================================================================
子体归集规则:
  判定层级: 逐子体
  基础分取列: 按命中子体的变体重要性取列（含库存类）
  父卡执行分数: "最高分主导 + 并发加成（见 R4）"
  父卡严重度: 取所有子体异常中最高
  保留明细: true   # 每个子体异常明细独立保留

# =============================================================================
# §3.6 广告与销量类异常专项判定
# =============================================================================
# 共同触发前提：连续 ≥3 天满足偏离条件
ACOS异常:
  来源章节: "§3.6 (1)"
  基线: 目标ACOS   # 来源：辅助决策 agent → app_db.acos_override.value
  连续天数门槛: 3
  # 样本量前置规则（任一满足即可）
  样本量门槛:
    模式: 任一满足
    条件:
      - 名称: 花费门槛
        描述: "近3天累计广告花费 ≥ 近7天日均花费 × 3 × 50%"
        字段: [近3天累计广告花费, 近7天日均花费]
        表达式: "近3天累计广告花费 >= 近7天日均花费 * 3 * 0.5"
      - 名称: 点击门槛
        描述: "近3天累计点击 ≥ 20 次"
        字段: [近3天累计点击]
        表达式: "近3天累计点击 >= 20"
  样本量不足输出: "ACOS样本不足观察"
  当前值: 近3天平均ACOS
  # 分档：偏离比 = (当前 - 基线) / 基线（超出方向为正）
  # 例：基线 0.30，当前 0.60 → 偏离比 = 1.0（超出 100%）
  分档:
    - 名称: 不预警
      严重度: null
      偏离比_下限: null       # -∞
      偏离比_上限: 0.30       # 超出 <30%
    - 名称: 超出30-60
      严重度: S2
      偏离比_下限: 0.30
      偏离比_上限: 0.60
    - 名称: 超出60-100
      严重度: S1
      偏离比_下限: 0.60
      偏离比_上限: 1.00
    - 名称: 超出大于100
      严重度: S0
      偏离比_下限: 1.00
      偏离比_上限: null       # +∞

广告花费异常_超出:
  来源章节: "§3.6 (2)"
  基线: 目标每日预算   # 来源：辅助决策 agent → app_db.budget_override.value
  连续天数门槛: 3
  当前值: 近3天平均花费
  方向: 超出
  分档:
    - 名称: 不预警
      严重度: null
      偏离比_下限: null
      偏离比_上限: 0.30
    - 名称: 超出30-50
      严重度: S2
      偏离比_下限: 0.30
      偏离比_上限: 0.50
    - 名称: 超出50-100
      严重度: S1
      偏离比_下限: 0.50
      偏离比_上限: 1.00
    - 名称: 超出大于100
      严重度: S0
      偏离比_下限: 1.00
      偏离比_上限: null

广告花费异常_不足:
  来源章节: "§3.6 (3)"
  基线: 目标每日预算   # 来源：辅助决策 agent → app_db.budget_override.value
  连续天数门槛: 3
  当前值: 近3天平均花费
  方向: 下降    # 下降幅度 = (基线 - 当前) / 基线，取正值
  说明: "花费不足封顶 S1（机会成本）"
  分档:
    - 名称: 不预警
      严重度: null
      下降比_下限: null
      下降比_上限: 0.30
    - 名称: 下降30-50
      严重度: S2
      下降比_下限: 0.30
      下降比_上限: 0.50
    - 名称: 下降大于50
      严重度: S1
      下降比_下限: 0.50
      下降比_上限: null

销量异常_下降:
  来源章节: "§3.6 (4) 下降方向"
  基线: 过去7天日均销量
  连续天数门槛: 3
  当前值: 近3天日均销量
  # 比例 = 当前 / 基线
  分档:
    - 名称: 不预警
      严重度: null
      比例_下限: 0.70
      比例_上限: null        # +∞（≥70% 不预警）
    - 名称: 50-70
      严重度: S2
      比例_下限: 0.50
      比例_上限: 0.70
    - 名称: 30-50
      严重度: S1
      比例_下限: 0.30
      比例_上限: 0.50
    - 名称: 小于30
      严重度: S0
      比例_下限: null
      比例_上限: 0.30

销量增长提示:
  来源章节: "§3.6 (4) 上升方向"
  基线: 过去7天日均销量
  连续天数门槛: 3
  当前值: 近3天日均销量
  说明: "封顶 S1，属于机会提示型"
  分档:
    - 名称: 不预警
      严重度: null
      比例_下限: null
      比例_上限: 1.50
    - 名称: 150-200
      严重度: S2
      比例_下限: 1.50
      比例_上限: 2.00
    - 名称: 大于200
      严重度: S1
      比例_下限: 2.00
      比例_上限: null

# =============================================================================
# §3.7 目标偏离
# =============================================================================
目标偏离:
  来源章节: "§3.7"
  基线: 日均目标单量_ERP设定
  # 三窗口
  窗口:
    当日: 仅观察不预警
    近3天: 连续偏离才判定
    近7天: 判断趋势和月目标
  # 主分档：近3天日均 / 日均目标 连续偏离
  分档:
    - 名称: 不预警
      严重度: null
      比例_下限: 0.70
      比例_上限: null
    - 名称: 50-70
      严重度: S2
      比例_下限: 0.50
      比例_上限: 0.70
    - 名称: 30-50
      严重度: S1
      比例_下限: 0.30
      比例_上限: 0.50
    - 名称: 小于30
      严重度: S0
      比例_下限: null
      比例_上限: 0.30
  # S0 升级触发（任一命中即升 S0，覆盖上表判定）
  S0升级条件:
    - "近7天内逐日实际单量均低于日均目标，连续7天"
    - "月累计完成率 / 月时间进度 < 0.50"

# =============================================================================
# §3.8 自然流量异常
# =============================================================================
自然流量异常:
  来源章节: "§3.8"
  基线: 近7天平均自然订单占比
  当前值: 近3天平均自然订单占比
  连续天数门槛: 3
  # 被动下降豁免：自然订单数未下降只是总订单上涨 → 转 §6.0.8 查证，不直接按下滑处理
  被动下降豁免: true
  # 分档：下降幅度（百分点，不是百分比！）
  # 例：基线 40%，当前 25% → 下降 15 个百分点
  分档:
    - 名称: 不预警
      严重度: null
      下降百分点_下限: null
      下降百分点_上限: 10
    - 名称: 10-20pp
      严重度: S2
      下降百分点_下限: 10
      下降百分点_上限: 20
    - 名称: 20-35pp
      严重度: S1
      下降百分点_下限: 20
      下降百分点_上限: 35
    - 名称: 大于35pp
      严重度: S0
      下降百分点_下限: 35
      下降百分点_上限: null
  # S0 升级触发
  S0升级条件:
    - "近7天内逐日自然占比均低于前7天平均基线，连续7天"

# =============================================================================
# §3.9 卡位异常
# =============================================================================
卡位异常:
  来源章节: "§3.9"
  基线: 近7天平均卡位（整数名次）
  当前值: 近3天平均卡位
  连续天数门槛: 3
  说明: "卡位数字变大表示下滑；下滑比例 = (当前 - 基线) / 基线"
  # 数据源已接入（2026-07-21）：
  #   own_keyword_flow 选核心词 → erp_listing_asin_keyword_rank_history 拉逐日排名
  #   → keyword_rank_daily 表 → daily_monitor 算 近3天/近7天/逐日卡位
  #   同步脚本：data/sync_keyword_rank.py
  数据源待补: false
  # 卡位为整数
  分档:
    - 名称: 不预警
      严重度: null
      下滑比例_下限: null
      下滑比例_上限: 0.20
    - 名称: 20-50
      严重度: S2
      下滑比例_下限: 0.20
      下滑比例_上限: 0.50
    - 名称: 50-100
      严重度: S1
      下滑比例_下限: 0.50
      下滑比例_上限: 1.00
    - 名称: 大于100
      严重度: S0
      下滑比例_下限: 1.00
      下滑比例_上限: null
  S0升级条件:
    - "近7天内逐日卡位名次均高于前7天平均基线，连续7天"

# =============================================================================
# §3.10 链接转化率异常下降（周维度，双基准，取严重度高者）
# =============================================================================
链接转化率异常下降:
  来源章节: "§3.10"
  层级: 链接级
  周期: 周
  # 空值不判定
  空值处理: "不触发正式异常；标记为'转化率数据为空/待数据积累'"
  空值定义: "字段为空、未生成、无法计算；注意 0 是有效值不是空"
  # 最低样本量
  样本量门槛:
    模式: 全部满足
    条件:
      - 描述: "本周会话 >= 100"
        字段: 本周会话
      - 描述: "用于本周vs上周比较时，两周均需有有效会话"
  观察阈值: "本周会话 <100 但 本周+上周订单商品总数 >=10 时进入观察"
  观察输出: "转化率样本不足观察"
  # 基准 A：本周 vs 上周
  基准A_名称: 本周vs上周
  基准A_公式: "降幅 = (上周 - 本周) / 上周"
  基准A_分档:
    - 名称: 不预警
      严重度: null
      降幅_下限: null
      降幅_上限: 0.20
    - 名称: 20-50
      严重度: S2
      降幅_下限: 0.20
      降幅_上限: 0.50
    - 名称: 50-80
      严重度: S1
      降幅_下限: 0.50
      降幅_上限: 0.80
    - 名称: 大于80
      严重度: S0
      降幅_下限: 0.80
      降幅_上限: null
  # 基准 B：本周 vs 类目均值
  基准B_名称: 本周vs类目均值
  基准B_公式: "比例 = 本周转化率 / 类目平均转化率"
  基准B_分档:
    - 名称: 不预警
      严重度: null
      比例_下限: 0.80
      比例_上限: null       # >=0.80 接近同类
    - 名称: 50-80
      严重度: S2
      比例_下限: 0.50
      比例_上限: 0.80
    - 名称: 30-50
      严重度: S1
      比例_下限: 0.30
      比例_上限: 0.50
    - 名称: 小于30
      严重度: S0
      比例_下限: null
      比例_上限: 0.30
  取严重度: 两基准严重度取高者

# =============================================================================
# §3.11 售后异常专项（评分/退款，双基准）
# =============================================================================
评分异常:
  来源章节: "§3.11 评分"
  层级: 链接级
  周期: 每日抓取（慢变量，不用三窗口）
  空值处理: "不触发正式异常；标记为'评分数据为空/待数据积累'"
  空值定义: "字段为空或未生成"
  样本注:
    "评分已生成的，无论评分数多少均可判定；样本少时任务卡标注'评分样本少'"
  # 基准 A：当前评分 vs 近7天平均评分（绝对下降分数）
  # ⚠️ 数据源待补：无 MCP 直接工具提供历史评分序列
  # 长期方案：daily_monitor 每日抓 listing_baseline.星级 落 daily_star_snapshot 表
  # severity_grader.判评分异常 传入 近7天平均评分=None 时，本基准 A 自动跳过、只走基准B
  基准A_数据源待补: true
  基准A_名称: 相对近7天均
  基准A_公式: "下降 = 近7天均 - 当前评分"
  基准A_分档:
    - 名称: 不预警
      严重度: null
      下降_下限: null
      下降_上限: 0.10
    - 名称: 0.1-0.3
      严重度: S2
      下降_下限: 0.10
      下降_上限: 0.30
    - 名称: 0.3-0.5
      严重度: S1
      下降_下限: 0.30
      下降_上限: 0.50
    - 名称: 大于0.5
      严重度: S0
      下降_下限: 0.50
      下降_上限: null
  # 基准 B：当前评分 vs 目标评分（低于即 S1，与目标差多少无关）
  基准B_名称: 相对目标评分
  基准B_公式: "当前 vs 目标"
  基准B_分档:
    - 名称: 达标
      严重度: null
      达标: true
    - 名称: 低于目标
      严重度: S1
      达标: false
  取严重度: 两基准严重度取高者

退款异常:
  来源章节: "§3.11 退款"
  层级: 链接级
  周期: 周
  # 数据完整性
  数据完整性规则: "本周与上周均需有正常退款率数据；否则不触发环比判定"
  数据不足输出: "退款数据不足/待补充"
  # 最低样本量
  样本量门槛:
    模式: 任一满足
    条件:
      - 描述: "本周订单商品总数 >= 20"
      - 描述: "本周+上周订单商品总数 >= 30"
  样本不足输出: "退款样本不足观察"
  # 基准 A：16周退款率 vs 32周（相对上升，长趋势）
  基准A_名称: 16周vs32周
  基准A_公式: "上升 = (16周 - 32周) / 32周"
  基准A_分档:
    - 名称: 不预警
      严重度: null
      上升_下限: null
      上升_上限: 0.30
    - 名称: 30-60
      严重度: S2
      上升_下限: 0.30
      上升_上限: 0.60
    - 名称: 60-100
      严重度: S1
      上升_下限: 0.60
      上升_上限: 1.00
    - 名称: 大于100
      严重度: S0
      上升_下限: 1.00
      上升_上限: null
  # 基准 B：16周退款率 vs 类目均值（倍数）
  基准B_名称: 16周vs类目均值
  基准B_公式: "倍数 = 16周退款率 / 类目平均退换货率"
  基准B_分档:
    - 名称: 不预警
      严重度: null
      倍数_下限: null
      倍数_上限: 1.20
    - 名称: 1.2-1.5倍
      严重度: S2
      倍数_下限: 1.20
      倍数_上限: 1.50
    - 名称: 1.5-2倍
      严重度: S1
      倍数_下限: 1.50
      倍数_上限: 2.00
    - 名称: 大于2倍
      严重度: S0
      倍数_下限: 2.00
      倍数_上限: null
  取严重度: 两基准严重度取高者

# =============================================================================
# §3.12 放量未执行（该做没做型）
# =============================================================================
放量未执行:
  来源章节: "§3.12"
  说明: "5 个条件全部满足即触发，默认 S1"
  默认严重度: S1
  条件:
    - 名称: 销量达标
      表达式: "连续7天日均销量 >= 日均目标单量"
      字段: [近7天日均销量, 日均目标单量]
    - 名称: 库存充足
      表达式: "可售库存 >= 日均单量 * 1.2 * 30"
      字段: [可售库存, 日均单量]
      系数说明: "1.2 = 放量增幅20%; 30 = 支撑1个月"
    - 名称: ACOS健康
      表达式: "连续7天平均ACOS < 目标ACOS"
      字段: [近7天平均ACOS, 目标ACOS]
      数据不足边界: "近7天ACOS为空/未生成/广告样本不足时，不得判定为健康"
    - 名称: 广告未放量
      表达式: "近3天平均花费 <= 近7天平均花费 * 1.1"
      字段: [近3天平均花费, 近7天平均花费]
    - 名称: 自然占比上涨
      表达式: "近7天平均自然占比 > 前7天平均自然占比 AND 近3天平均自然占比 >= 近7天平均自然占比"
      字段: [近7天平均自然占比, 前7天平均自然占比, 近3天平均自然占比]
  数据不足输出: "放量机会待评估/ACOS数据不足"

# =============================================================================
# §3.13 库存积压（A 可售天数 + B 目标累计 交叉）
# =============================================================================
库存积压:
  来源章节: "§3.13"
  层级: 链接级
  数据完整性: "必须具备 可售库存/近30天日均销量/未来2-4月目标累计；否则不输出S档"
  数据不足输出: "库存压力待确认/数据不足"
  # 新品豁免
  新品观察: "有效销售天数不足7天 → 输出'新品库存压力待观察'"
  日均销量为0处理:
    非新品有库存: "可售天数按'>120天'处理，A档 S0"
    新品期: "输出'新品库存压力待观察'"
  # A 档：可售天数
  A_名称: 可售天数
  A_公式: "可售天数 = 可售库存 / 近30天日均销量"
  A_分档:
    - 名称: 不预警
      严重度: null
      天数_下限: null
      天数_上限: 60
    - 名称: 60-90天
      严重度: S2
      天数_下限: 60
      天数_上限: 90
    - 名称: 90-120天
      严重度: S1
      天数_下限: 90
      天数_上限: 120
    - 名称: 大于120天
      严重度: S0
      天数_下限: 120
      天数_上限: null
  # B 档：未来目标累计（可售库存 / 未来N月目标累计）
  B_名称: 目标累计月数
  B_公式: "月数 = 可售库存 覆盖 未来N月目标累计（含淡旺季）"
  B_分档:
    - 名称: 不预警
      严重度: null
      月数_下限: null
      月数_上限: 2
    - 名称: 2-3月
      严重度: S2
      月数_下限: 2
      月数_上限: 3
    - 名称: 3-4月
      严重度: S1
      月数_下限: 3
      月数_上限: 4
    - 名称: 大于4月
      严重度: S0
      月数_下限: 4
      月数_上限: null
  # 交叉规则
  交叉规则:
    - 情况: "A、B 均不预警"
      处理: 不输出
    - 情况: "A、B 均有预警"
      处理: 取较高严重度
    - 情况: "A 有预警 B 不预警"
      处理: "A 档降一档后输出，提示复核未来目标是否可靠"
    - 情况: "A 不预警 B 有预警"
      处理: "B 档降一档后输出，提示复核淡旺季和目标是否合理"
    - 情况: "A 或 B 关键数据缺失"
      处理: "不输出正式 S 档，输出'库存压力待确认/数据不足'"
  降档规则: {S0: S1, S1: S2, S2: null}   # null 表示只观察不输出

# =============================================================================
# §3.14 滞销异常
# =============================================================================
滞销异常:
  来源章节: "§3.14"
  层级: 子ASIN识别 + 父ASIN汇总
  数据完整性: "必须具备 超龄库存量/命中子ASIN近30天日均销量/单月超龄仓租费用/FBA库龄状态；子体订单流近30天至少覆盖25天，最新数据距今不超过5天"
  # 准入条件（3 个全部满足才进入）
  准入条件:
    - 名称: 有滞销库存
      描述: "存在收取超龄仓租的库存"
    - 名称: 消化不完
      描述: "命中子ASIN滞销库存 / 命中子ASIN近30天日均销量 > 30 天"
    - 名称: 超龄费达规模
      描述: "父ASIN汇总单月超龄仓租费用 > 20 USD"
      阈值_USD: 20
  # 消化周期口径
  日均销量公式: "近30天窗口累计订单 / 实际覆盖天数；不按固定30天除"
  消化周期公式: "滞销库存消化周期 = 命中子ASIN滞销库存 / 命中子ASIN近30天日均销量"
  日均销量为0处理:
    有滞销库存: "消化周期按 >120 天处理（S0）"
    日均销量为空: "按数据不足处理，不输出S档"
  # 分档
  分档:
    - 名称: 30-60天
      严重度: S2
      消化周期_下限: 30
      消化周期_上限: 60
    - 名称: 60-120天
      严重度: S1
      消化周期_下限: 60
      消化周期_上限: 120
    - 名称: 大于120天
      严重度: S0
      消化周期_下限: 120
      消化周期_上限: null
  # 与库存积压共现去重
  共现去重规则:
    同时触发: "取滞销异常作为主任务；库存积压不重复生成主任务、不重复计入打分，作为关联展示"
    仅触发滞销: "正常报滞销异常"
    仅触发库存积压: "正常报库存积压"

