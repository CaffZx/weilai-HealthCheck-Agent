# =============================================================================
# R2 · 异常字典（Anomaly Dictionary）
# =============================================================================
# 来源：docs/业务巡检Agent-代码实现版.md 模块 2（§2.0–§2.8）
# 版本：2026-07-09 · v1
#
# 【业务边界】
# 本文件只管"异常是什么、命中条件是什么、作用层级归哪级、是否跳过表现型"，不管：
#   - 严重度判定（→ R3_严重度阈值.yaml）
#   - 打分（→ R4_打分参数.yaml）
#   - 数据获取（→ data/sync/*）
#   - 处理建议（→ R6_处理建议.yaml）
#
# 【输入契约】给 inspector/engine/anomaly_detector.py：
#   1. 产品的状态/字段数据（如 后台链接状态、FBA可售库存、评论数据 等）
#   2. 已算好的表现指标（如 ACOS异常需 R3 判定）
#
# 【输出契约】：
#   - 命中的异常点位列表（含 作用层级、命中变体、类型、是否跳过表现型）
#   - 数据不足场景 → 观察类结果
#
# 【维护约定】
#   - 现象即原因型：本文件直接定义命中条件（阈值、判定表达式）
#   - 表现型：本文件只定义"由 R3 专项判定"，具体逻辑走 severity_grader
#   - 字段名对齐 MCP/本地库/文档，如 FBA可售库存、后台可售状态
# =============================================================================

版本: "2026-07-09-v1"
说明: "字段定义与命中条件；改动需同步更新 docs/业务巡检Agent-代码实现版.md 模块 2"

# =============================================================================
# 7 大异常大类总览
# =============================================================================
异常大类:
  "2.1":
    名称: 链接状态异常
    类型: 现象即原因型
    关注: "链接能否正常展示/购买/销售、成交主导权"
  "2.2":
    名称: 内容完整性异常
    类型: 现象即原因型
    关注: "页面内容是否完整、能否承接流量转化"
  "2.3":
    名称: 价格与促销异常
    类型: 现象即原因型
    关注: "价格促销是否正常承接成交"
  "2.4":
    名称: 库存与可售异常
    类型: 现象即原因型
    关注: "库存能否支撑继续销售"
  "2.5":
    名称: 交易表现异常
    类型: 表现型
    关注: "转化/销量/广告等结果指标"
    例外_现象即原因: [放量未执行]
  "2.6":
    名称: 合规与属性异常
    类型: 现象即原因型
    关注: "是否存在平台规则风险"
  "2.7":
    名称: 售后异常
    类型: 表现型
    关注: "差评/评分/退款等售后信号是否影响买家信任与经营"

# =============================================================================
# §2.0 异常作用层级 + 归类
# =============================================================================
# 每个异常点位归到 变体级 或 链接级；决定 R4.1 基础分取哪一列
# 库存类异常特殊：在子体层识别，按命中变体重要性取列
作用层级归类:
  变体级:
    - 链接不可售           # 每个子ASIN各有状态
    - 变体掉线
    - Buy Box丢失
    - 主图异常
    - 图片异常
    - A+异常
    - 变体价差异常
    - FBA可售库存为0
    - 库存不足
    - 合规异常              # 固定子体级，不适用链接级兜底
  链接级:
    - 父子体关系异常         # 父体结构级
    - 标题异常
    - 五点异常
    - 促销异常
    - 库存积压
    - 滞销异常
    - 链接转化率异常下降
    - 销量异常
    - 销量增长提示
    - ACOS异常
    - 广告花费异常
    - 目标偏离
    - 自然流量异常
    - 卡位异常
    - 放量未执行
    - 近期集中差评
    - 评分异常
    - 退款异常
  按命中对象:                # 命中具体子体按变体级，影响整个链接按链接级
    - 类目异常
    - 属性信息异常

# ACOS/广告花费/销量三者说明：父体级数据，天然归链接级
父体级指标点位:
  - ACOS异常
  - 广告花费异常
  - 销量异常
  - 销量增长提示

# =============================================================================
# §2.0.1 表现型异常巡检跳过规则
# =============================================================================
# 命中下表点位后，本轮跳过对应表现型异常的独立判定与查因
# 分层跳过原则（按命中变体重要性）：
#   ① 无条件跳过：父子体关系异常
#   ② 分层：主要色命中跳过整个父ASIN的表现型；次要色/长尾色命中不跳过父ASIN
#   ③ 库存类归入②
表现型跳过规则:
  # 无条件跳过父ASIN表现型（父体级数据失真）
  无条件跳过:
    - 父子体关系异常

  # 按命中变体重要性分层跳过
  分层跳过:
    点位:
      - 链接不可售
      - Buy Box丢失
      - 主图异常
      - 合规异常
      - 变体掉线
      - FBA可售库存为0
      - 库存不可售     # 兼容旧名
    命中主要色: 跳过父ASIN的所有表现型判定与查因
    命中次要色或长尾色: 不跳过父ASIN；该变体问题按变体级异常单独处理
    整条Listing全变体命中: 视同波及主要色，跳过

  # 不跳过（即使命中也照常判表现型）
  不跳过:
    - 图片异常
    - 标题异常
    - 五点异常
    - A+异常
    - 变体价差异常
    - 促销异常
    - 库存不足
    - 库存积压
    - 滞销异常
    - 类目异常
    - 属性信息异常

  # 表现型点位本身不参与本规则（它们是被判断对象）
  自身即表现型:
    - 链接转化率异常下降
    - 销量异常
    - 销量增长提示
    - ACOS异常
    - 广告花费异常
    - 目标偏离
    - 自然流量异常
    - 卡位异常
    - 放量未执行         # 现象即原因型例外
    - 近期集中差评
    - 评分异常
    - 退款异常

# =============================================================================
# §2.1 链接状态异常（现象即原因型，全部 S0）
# =============================================================================
# 命中条件：由 MCP 返回的状态字段直接命中即触发
链接不可售:
  层级: 变体级（子体层识别）
  类型: 现象即原因型
  定义: "链接前台无法作为正常在售商品展示，或后台状态不再属于正常可售范围"
  边界: "库存维度导致的'有库存但不可售'归 2.4 库存不可售，非本点位"
  所需数据字段:
    - 后台链接状态         # 期望值：正常在售
    - 前台展示状态         # 期望值：可正常展示
    - 后台可售状态         # 期望值：可售
    - 禁止显示搜索结果标记 # 期望值：否
    - 报价状态             # 期望值：正常有报价
    - 抑制标记             # 期望值：无
    - 下架标记             # 期望值：无
  # 命中条件：任一异常即触发
  命中条件_任一满足:
    - "后台可售状态 != '可售'"
    - "禁止显示搜索结果标记 == '是'"
    - "抑制标记 == '是'"
    - "下架标记 == '是'"
    - "报价状态 == '缺失' 或 报价状态 == '异常'"
    - "前台展示状态 == '不可展示'"

变体掉线:
  层级: 变体级
  类型: 现象即原因型
  定义: "原本挂在父体下的单个或部分子体脱离父体（父体结构仍在）"
  边界: "只要父体结构仍在、掉出的是部分子体，均归本点位；全部子体掉出归'父子体关系异常'"
  所需数据字段:
    - 父子体挂接关系
    - 子体前台归属
  命中条件: "父体结构存在 AND (至少一个子体但非全部) 脱离父体挂接"
  互斥: [父子体关系异常]

父子体关系异常:
  层级: 链接级（父体结构级）
  类型: 现象即原因型
  定义: "父体被拆，全部子体从原父体结构中掉出"
  边界: "仅当父体结构被拆散、全部子体掉出时归本点位；部分掉出归'变体掉线'"
  所需数据字段:
    - 父体结构状态
    - 全部子体挂接关系
  命中条件: "父体结构状态 == '被拆' AND 全部子体脱离原父体"
  互斥: [变体掉线]

Buy Box丢失:
  层级: 变体级
  类型: 现象即原因型
  定义: "商品未获得 Buy Box（链接仍在售，但未拿到黄金购物车，直接影响成交）"
  所需数据字段:
    - Buy Box状态
    - 价格
    - 配送方式
  命中条件: "Buy Box状态 != '拥有'"

# =============================================================================
# §2.2 内容完整性异常
# =============================================================================
主图异常:
  层级: 变体级
  类型: 现象即原因型
  默认严重度: S0
  定义: "主图缺失、错误、审核未通过或前台展示异常"
  所需数据字段:
    - 主图字段         # 是否有主图
    - 审核状态         # 期望：通过
    - 前台展示         # 期望：正常显示
    - ERP图片基准      # 用于比对是否被改
  命中条件_任一满足:
    - "主图字段 == '缺失'"
    - "审核状态 IN ['未通过','审核中','异常']"
    - "前台展示 == '异常'"
    - "主图 != ERP图片基准"    # 主图被改
  第一版不做视觉识别: true      # 不判模糊/白底/美观，仅判缺失/禁止/审核

图片异常:
  层级: 变体级
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "副图数量、审核状态或前台展示异常"
  所需数据字段:
    - 副图数量
    - 审核状态
    - 前台展示
  最低副图数量: 3
  命中条件_任一满足:
    - "副图数量 < 最低副图数量"
    - "审核状态 IN ['未通过','异常']"
    - "前台展示 == '异常'"

标题异常:
  层级: 链接级
  类型: 现象即原因型
  默认严重度: S0
  定义: "标题缺失、审核异常或与 ERP 基准不一致"
  所需数据字段:
    - 标题字段
    - 审核状态
    - ERP标题基准
  命中条件_任一满足:
    - "标题字段 == '缺失' 或 空字符串"
    - "审核状态 == '未通过'"
    - "标题字段 != ERP标题基准"    # 标题被改

五点异常:
  层级: 链接级
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "五点内容缺失或审核异常"
  所需数据字段:
    - 五点内容字段
    - 审核状态
  最低五点数量: 5
  命中条件_任一满足:
    - "五点内容字段的项数 < 最低五点数量"
    - "审核状态 IN ['未通过','异常']"

A+异常:
  层级: 变体级（子体级）
  类型: 现象即原因型
  默认严重度: S2
  可共因上调: true
  定义: "A+ 内容缺失、审核未通过或前台未展示"
  所需数据字段:
    - A+内容状态
    - 审核状态
    - 前台展示
  命中条件_任一满足:
    - "A+内容状态 == '未创建' 或 '缺失'"
    - "审核状态 IN ['未通过','审核中']"
    - "前台展示 == '未展示'"

# =============================================================================
# §2.3 价格与促销异常
# =============================================================================
变体价差异常:
  层级: 变体级
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "同一父ASIN下，各变体前台到手价差距明显偏离正常价格带"
  边界: "运营动作（活动价、Coupon、清货、少库存控速）导致的价差标记为'需运营复核'，不进正式打分"
  所需数据字段:
    - 各变体前台到手价
    - 变体重要性
    - 尺码分类
    - 颜色分类
    - Coupon
    - 活动价
  比价基准: "主流量入口颜色（主要色）中价格最低尺码的前台到手价"
  # 命中规则（尺码分支）
  尺码分支:
    描述: "主要色内其他尺码到手价相对基准的差距"
    命中条件: "差距 >= 40% AND 绝对差距 >= $5"
    差距比例阈值: 0.40
    绝对差距阈值_USD: 5
    命中对象记录: 价格偏离的尺码子体
    基础分取列: 主要色
  # 命中规则（颜色分支）
  颜色分支:
    描述: "其他颜色各子体到手价相对基准的差距"
    命中条件: "差距 >= 70% AND 绝对差距 >= $14"
    差距比例阈值: 0.70
    绝对差距阈值_USD: 14
    命中对象记录: 价格偏离的颜色子体
    基础分取列: 按该子体变体重要性
  运营动作标记: 需运营复核

促销异常:
  层级: 链接级
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "ERP系统活动配置存在但前台未展示；促销未生效、折扣错误、类型不一致"
  所需数据字段:
    - ERP活动配置
    - 前台促销展示
    - 活动审核状态
  命中条件_任一满足:
    - "ERP活动配置存在 AND 前台促销展示 == '未展示'"
    - "活动审核状态 IN ['未通过','异常']"
    - "前台展示活动类型 != ERP配置活动类型"
    - "折扣计算与配置不一致"

# =============================================================================
# §2.4 库存与可售异常
# =============================================================================
"FBA可售库存为0":
  层级: 变体级（子体层识别，分色取列）
  类型: 现象即原因型
  默认严重度: S0
  定义: "FBA当前可售库存为0，已无法承接后续销售"
  所需数据字段:
    - FBA可售库存        # 来自 MCP parent_listing_stock_summary
    - 子体ASIN
    - 变体重要性
  命中条件: "FBA可售库存 == 0"

库存不足:
  层级: 变体级（子体层识别，分色取列）
  类型: 现象即原因型
  默认严重度: S0
  定义: "FBA可售库存 > 0，但低于未来14天预计消耗（过去7天日均销量×14）"
  所需数据字段:
    - FBA可售库存
    - 过去7天日均销量
    - 子体ASIN
    - 变体重要性
  预计消耗天数: 14
  命中条件: "FBA可售库存 > 0 AND FBA可售库存 < 过去7天日均销量 × 预计消耗天数"

库存积压:
  层级: 链接级（父ASIN汇总）
  类型: 现象即原因型
  默认严重度: 见§3.13
  定义: "可售库存相对近期消化能力和未来目标消化能力明显偏高"
  所需数据字段:
    - 可售库存
    - 近30天日均销量
    - 未来2-4个月目标累计
  判定: "由 §3.13 A×B 交叉判定 → severity_grader.判库存积压"

滞销异常:
  层级: 链接级（子ASIN查、父ASIN汇总）
  类型: 现象即原因型
  默认严重度: 见§3.14
  定义: "已产生超龄仓租，且超龄库存短期无法消化、费用损失达到规模"
  区别于库存积压: "看超龄库存是否卖得掉，而库存积压看整体可售库存"
  所需数据字段:
    - 超龄库存量
    - 单月超龄仓租费用
    - FBA库龄/超龄状态
    - 命中子ASIN近30天日均销量
  判定: "由 §3.14 准入条件 + 消化周期分档 → severity_grader.判滞销异常"

# =============================================================================
# §2.5 交易表现异常（表现型，除放量未执行）
# =============================================================================
链接转化率异常下降:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.10
  周期: 周维度
  定义: "链接转化率较历史水平或类目平均水平明显下降"
  所需数据字段:
    - 本周转化率
    - 上周转化率
    - 本周会话
    - 上周会话
    - 本周订单商品总数
    - 类目平均转化率
  判定: "由 §3.10 双基准 → severity_grader.判链接转化率异常"

销量异常:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.6
  定义: "当前销量较过去7天日均连续 ≥3 天大幅偏离（下降方向）"
  所需数据字段:
    - 当日销量
    - 过去7天日均销量
  判定: "由 §3.6 → severity_grader.判销量类异常"

销量增长提示:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.6
  定义: "当前销量较过去7天日均连续 ≥3 天大幅偏离（上升方向）"
  与放量未执行的共现规则: "同时命中时，仅输出放量未执行；销量增长数据作判断依据"
  判定: "由 §3.6 → severity_grader.判销量类异常"

ACOS异常:
  层级: 链接级（父体级指标）
  类型: 表现型
  默认严重度: 见§3.6
  所需数据字段:
    - 实际ACOS
    - 近7天平均ACOS
    - 近3天累计广告花费
    - 近3天累计点击
  判定: "由 §3.6 → severity_grader.判ACOS异常"

广告花费异常:
  层级: 链接级（父体级指标）
  类型: 表现型
  默认严重度: 见§3.6
  方向: [超出, 不足]
  所需数据字段:
    - 实际花费
    - 近7天平均花费
    # 查证用
    - 曝光量
    - 点击量
    - 广告单量
    - 自然单量
  判定: "由 §3.6 → severity_grader.判广告花费异常"

目标偏离:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.7
  所需数据字段:
    - 实际单量
    - 日均目标单量
    - 月目标
    - 月累计完成率
    - 月时间进度
  判定: "由 §3.7 → severity_grader.判目标偏离"

自然流量异常:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.8
  所需数据字段:
    - 自然订单数
    - 总订单数
    - 近7天平均自然订单占比
  判定: "由 §3.8 → severity_grader.判自然流量异常"

卡位异常:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.9
  所需数据字段:
    - 当前卡位
    - 近7天平均卡位
  判定: "由 §3.9 → severity_grader.判卡位异常"

放量未执行:
  层级: 链接级
  类型: 现象即原因型      # §2.5 例外，5 条件全满足即触发
  默认严重度: S1
  与销量增长提示的共现规则: "同时命中时优先输出放量未执行"
  所需数据字段:
    - 日均销量
    - 日均目标单量
    - 可售库存
    - 近7天ACOS
    - 目标ACOS
    - 近3天广告花费
    - 近7天自然订单占比
  判定: "由 §3.12 → severity_grader.判放量未执行"

# =============================================================================
# §2.6 合规与属性异常
# =============================================================================
类目异常:
  层级: 按命中对象（变体级或链接级）
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "商品类目被错误修改，或类目与产品实际不匹配"
  所需数据字段:
    - 类目路径
    - 平台提示
    - ERP类目基准
  命中条件_任一满足:
    - "类目路径 != ERP类目基准"
    - "平台提示 == '类目不匹配'"

属性信息异常:
  层级: 按命中对象（变体级或链接级）
  类型: 现象即原因型
  默认严重度: S1
  可共因上调: true
  定义: "颜色、尺码、材质、适用场景等属性缺失、错误或与产品实际不一致"
  所需数据字段:
    - 属性字段
    - 页面展示
    - ERP属性基准
  命中条件_任一满足:
    - "属性字段有缺失"
    - "属性字段 != ERP属性基准"
    - "页面展示与后台不一致"

合规异常:
  层级: 变体级（子体级，固定）
  类型: 现象即原因型
  默认严重度: S0
  边界: "固定子体级，不适用链接级兜底"
  全子体命中: 视同波及主要色，跳过表现型
  定义: "已命中平台合规要求、认证要求、禁售/限售规则；后台明确合规提示"
  所需数据字段:
    - 平台合规提示
    - 平台合规状态
    - 认证要求字段
  命中条件_任一满足:
    - "平台合规状态 == '违规'"
    - "存在明确的合规提示"
    - "认证要求未满足 AND 平台已限制"

# =============================================================================
# §2.7 售后异常（表现型）
# =============================================================================
近期集中差评:
  层级: 链接级
  类型: 表现型
  默认严重度: S1              # §3.3 固定，不进 §3.11 专项分级
  定义: "14天内新增负面反馈达到量化触发条件"
  # 触发条件（任一满足即触发）
  触发条件_任一满足:
    - 名称: 条件1_低星集中同一问题
      描述: "14天内新增低星（≤3星）评论 >= 3条，且其中 >= 60% 集中指向同一类问题"
      阈值:
        天数: 14
        最低星阈值: 3
        最少差评数: 3
        同类占比阈值: 0.60
      归类由LLM完成: true         # 尺码/质量/物流/描述不符 等 → node_review
    - 名称: 条件2_相对现有评分比例
      描述: "14天内新增负面反馈数量 > 现有评分数的 20%"
      阈值:
        天数: 14
        占比阈值: 0.20
  所需数据字段:
    - 14天新增评论及星级
    - 现有评分数
    - 评论文本                   # 用于同类归类

评分异常:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.11
  所需数据字段:
    - 当前评分
    - 近7天平均评分
    - 目标评分
  判定: "由 §3.11 双基准 → severity_grader.判评分异常"

退款异常:
  层级: 链接级
  类型: 表现型
  默认严重度: 见§3.11
  所需数据字段:
    - 本周退款率
    - 上周退款率
    - 本周订单商品总数
    - 上周订单商品总数
    - 类目平均退换货率
  判定: "由 §3.11 双基准 → severity_grader.判退款异常"

# =============================================================================
# 互斥与共现规则汇总（供 anomaly_detector 去重用）
# =============================================================================
互斥点位:
  - [变体掉线, 父子体关系异常]         # 同一现象不得同时命中

共现去重:
  - 主异常: 放量未执行
    次异常: 销量增长提示
    规则: "同时命中时仅输出放量未执行"
  - 主异常: 滞销异常
    次异常: 库存积压
    规则: "同时命中时取滞销异常作为主任务；库存积压作为关联展示，不重复打分"

# =============================================================================
# 命中条件表达式的字段说明（供 anomaly_detector 校验必要字段）
# =============================================================================
现象即原因型_命中检测清单:
  # 只列有明确阈值/状态检测的点位（表现型不列，由 R3 判定）
  - 链接不可售
  - 变体掉线
  - 父子体关系异常
  - Buy Box丢失
  - 主图异常
  - 图片异常
  - 标题异常
  - 五点异常
  - A+异常
  - 变体价差异常
  - 促销异常
  - FBA可售库存为0
  - 库存不足
  - 类目异常
  - 属性信息异常
  - 合规异常

# =============================================================================
# 单元测试算例（供 anomaly_detector.py assert）
# =============================================================================
单元测试算例:
  # 库存不足：FBA=50, 日均=5, 14天消耗=70 → 50<70 命中
  - 场景: 库存不足_命中
    点位: 库存不足
    输入:
      FBA可售库存: 50
      过去7天日均销量: 5
    预期命中: true
    预期严重度: S0

  # 库存不足：FBA=100, 日均=5, 14天消耗=70 → 不命中
  - 场景: 库存不足_不命中
    点位: 库存不足
    输入:
      FBA可售库存: 100
      过去7天日均销量: 5
    预期命中: false

  # FBA=0
  - 场景: FBA可售库存为0_命中
    点位: FBA可售库存为0
    输入:
      FBA可售库存: 0
    预期命中: true
    预期严重度: S0

  # 变体价差 · 尺码分支：基准 $10，某尺码 $15，差 50% $5 → 命中
  - 场景: 变体价差异常_尺码_命中
    点位: 变体价差异常
    输入:
      基准价: 10.0
      对比子体:
        变体重要性: 主要色
        分类: 尺码
        到手价: 15.0
    预期命中: true
    预期分支: 尺码
    预期严重度: S1

  # 五点异常：只有 3 条五点 < 5 → 命中
  - 场景: 五点异常_数量不足
    点位: 五点异常
    输入:
      五点内容项数: 3
      审核状态: 通过
    预期命中: true
    预期严重度: S1

  # 图片异常：副图 2 张 < 3 → 命中
  - 场景: 图片异常_副图不足
    点位: 图片异常
    输入:
      副图数量: 2
      审核状态: 通过
      前台展示: 正常
    预期命中: true
    预期严重度: S1

  # 数据不足：库存不足需要 FBA可售库存 和 过去7天日均销量，缺一即观察
  - 场景: 库存不足_数据不足
    点位: 库存不足
    输入:
      FBA可售库存: 50
      # 缺 过去7天日均销量
    预期命中: false
    预期观察类: 数据不足

  # 跳过规则：链接不可售 + 主要色 → 跳过父ASIN表现型
  - 场景: 跳过规则_主要色链接不可售
    命中点位: 链接不可售
    命中变体重要性: 主要色
    预期跳过表现型: true

  - 场景: 跳过规则_次要色链接不可售
    命中点位: 链接不可售
    命中变体重要性: 次要色
    预期跳过表现型: false

  - 场景: 跳过规则_父子体关系异常
    命中点位: 父子体关系异常
    命中变体重要性: null
    预期跳过表现型: true
