# =============================================================================
# R4 · 打分参数（Priority Scoring Parameters）
# =============================================================================
# 来源：docs/业务巡检Agent-代码实现版.md 模块 4（§4.0–§4.9）
# 版本：2026-07-09 · v1
#
# 【业务边界】
# 本文件只管"打分公式的参数"，不管：
#   - 数据获取（→ data/sync/*）
#   - 严重度判定（→ R3_严重度阈值.yaml）
#   - 异常识别（→ R2_异常字典.yaml）
#   - 升降级/解除（→ R5_升降级规则.yaml）
#
# 【输入契约】给 inspector/engine/score_calculator.py 三个输入：
#   1. 严重度 S: 'S0' | 'S1' | 'S2'  （来自 R3 判定结果）
#   2. 作用层级: '链接级' | '变体级'    （来自 R2 归类）
#   3. 变体重要性: '主要色' | '次要色' | '长尾色' | null   （变体级才有）
#
# 【输出契约】
#   - 单异常执行分数（数字）
#   - 产品执行分数（数字，最高单异常分 + 其余×并发权重）
#   - 执行优先级 P0 / P1 / P2
#   - 破平次序号（用于分数相同时的排序）
#
# 【维护约定】
#   - 改这里不改代码，score_calculator.py 启动时读一次，运行时可通过 API reload
#   - 字段名一律用中文（跟文档、MCP、本地库对齐），不换成英文
#   - 每个数字后带 # 注释说明来源和是否可调
# =============================================================================

版本: "2026-07-09-v1"
说明: "初始建议值，需数据回流后校准。改动需同步更新 docs/业务巡检Agent-代码实现版.md"

# -----------------------------------------------------------------------------
# §4.0 执行分数公式
# -----------------------------------------------------------------------------
执行分数公式:
  单异常执行分数: "异常基础分 × 定位系数 × 阶段系数 × 淡旺季系数"
  产品执行分数: "最高单异常执行分数 + Σ(其余各异常执行分数 × 并发权重)"
  只有正式S0S1S2进入打分: true
  # 数据不足、样本不足观察、观察类提示不进入打分（§4.0 末段）

# -----------------------------------------------------------------------------
# §4.1 异常基础分（严重度 × 变体重要性 二维表）
# -----------------------------------------------------------------------------
# 取列规则：
#   - 作用层级=链接级        → 取 链接级 列
#   - 作用层级=变体级+主要色 → 取 变体级·主要色 列
#   - 作用层级=变体级+次要色 → 取 变体级·次要色 列
#   - 作用层级=变体级+长尾色 → 取 变体级·长尾色 列
# 变体级异常若无变体重要性数据 → 输出"数据不足"，该异常不进入打分（进观察）
异常基础分:
  S0:
    链接级: 100
    变体级·主要色: 100
    变体级·次要色: 70
    变体级·长尾色: 25
  S1:
    链接级: 60
    变体级·主要色: 60
    变体级·次要色: 42
    变体级·长尾色: 15
  S2:
    链接级: 30
    变体级·主要色: 30
    变体级·次要色: 21
    变体级·长尾色: 8

# -----------------------------------------------------------------------------
# §4.2 产品定位系数
# -----------------------------------------------------------------------------
# ERP 枚举值 → T 层 → 系数
# 注：ERP 枚举里的 P 是 ERP 既有值（P0_PRODUCT 等），与严重度 S、执行优先级 P 无关
产品定位系数:
  T0:                              # 战略级产品
    ERP枚举: "P0_PRODUCT"
    系数: 1.5
  T1:                              # 重点产品
    ERP枚举: "P1_PRODUCT"
    系数: 1.2
  T2:                              # 常规产品
    ERP枚举: "P2_PRODUCT"
    系数: 1.0
  T3:                              # 长尾产品
    ERP枚举: "P3_PRODUCT"
    系数: 0.6

# ERP 枚举 → T 层反向映射（代码用）
# 缺失/未识别：不猜，返回"数据不足"，该异常不参与打分（进观察）
定位ERP映射:
  P0_PRODUCT: T0
  P1_PRODUCT: T1
  P2_PRODUCT: T2
  P3_PRODUCT: T3

# -----------------------------------------------------------------------------
# §4.3 产品阶段系数（已确认"收割第一"）
# -----------------------------------------------------------------------------
产品阶段系数:
  收割利润:
    ERP枚举: [harvesting, HARVEST_PROFIT]
    系数: 1.3
  推进:
    ERP枚举: [pushing, PROMOTING]
    系数: 1.2
  维持:
    ERP枚举: [maintaining, MAINTAINING]
    系数: 1.0
  测试:
    ERP枚举: [testing, TESTING]
    系数: 0.8
  清货:
    ERP枚举: [liquidating, LIQUIDATING, 清货, 清货期]
    系数: 0.4

# ERP 枚举 → 阶段反向映射（代码用）
# 缺失/未识别：不猜，返回"数据不足"，该异常不参与打分（进观察）
阶段ERP映射:
  harvesting: 收割利润
  HARVEST_PROFIT: 收割利润
  pushing: 推进
  PROMOTING: 推进
  maintaining: 维持
  MAINTAINING: 维持
  testing: 测试
  TESTING: 测试
  liquidating: 清货
  LIQUIDATING: 清货
  清货: 清货
  清货期: 清货

# -----------------------------------------------------------------------------
# §4.4 淡旺季系数
# -----------------------------------------------------------------------------
淡旺季系数:
  旺季:
    ERP枚举: [PEAK, PEAK_SEASON, BIG_PEAK_SEASON, 旺季]
    系数: 1.3
  旺季前期:
    ERP枚举: [PEAK_SEASON_PREPARE, PEAK_PREPARE, 旺季前期]
    系数: 1.2
  旺季末期:
    ERP枚举: [PEAK_LATE, PEAK_SEASON_LATE, LATE_PEAK_SEASON, 旺季末期]
    系数: 1.0
  淡季:
    ERP枚举: [OFF, OFF_SEASON, 淡季]
    系数: 0.7

# ERP 枚举 → 淡旺季反向映射（代码用）
# 缺失/未识别：不猜，返回"数据不足"，该异常不参与打分（进观察）
淡旺季ERP映射:
  PEAK: 旺季
  PEAK_SEASON: 旺季
  BIG_PEAK_SEASON: 旺季           # 大旺季（ERP 自定义枚举）
  PEAK_SEASON_PREPARE: 旺季前期
  PEAK_PREPARE: 旺季前期
  PEAK_LATE: 旺季末期
  PEAK_SEASON_LATE: 旺季末期
  LATE_PEAK_SEASON: 旺季末期      # 旺季后期（ERP 自定义枚举）
  OFF: 淡季
  OFF_SEASON: 淡季

# -----------------------------------------------------------------------------
# §4.5 多异常并发权重
# -----------------------------------------------------------------------------
并发权重:
  默认: 0.2
  # 可选：按严重度分级（默认不启用，需在 code 中按开关切换）
  按严重度分级:
    启用: false
    S0: 0.3
    S1: 0.3
    S2: 0.15
  # 仅正式异常参与并发；下列不计入
  排除项:
    - 数据不足
    - 样本不足观察
    - 观察类提示
    - 共因去重后仅作为关联现象展示的异常

# -----------------------------------------------------------------------------
# §4.6 执行优先级阈值
# -----------------------------------------------------------------------------
执行优先级阈值:
  P0:
    区间: "≥ 90"
    分数下限: 90                   # 闭区间 [90, +∞)
    处理时限: "当天处理"
  P1:
    区间: "45 – 89"
    分数下限: 45                   # [45, 90)
    处理时限: "3 天内处理"
  P2:
    区间: "< 45"
    处理时限: "7 天内处理"          # (-∞, 45)

# P2 观察→升级的边界（§4.6 末段）
P2升级到P1: "满 14 天未处理"        # 具体逻辑由 R5 实现

# -----------------------------------------------------------------------------
# §4.9 分数相同时的破平规则（异常类型次序）
# -----------------------------------------------------------------------------
# 触发条件：仅当两产品的产品执行分数完全相同，或差值小于精度阈值时启用
破平精度阈值: 0.01                 # 差值小于此值视为同分（§4.9 说明）

# 破平次序（次序号越小越先呈现，不改分数、不改档）
破平次序:
  1:
    异常类型: "完全不能卖"
    包含点位: [链接不可售, FBA可售库存为0]
  2:
    异常类型: "卖得受阻/高断货风险"
    包含点位: [Buy Box丢失, 变体掉线, 父子体关系异常, 库存不足]
  3:
    异常类型: "合规高风险"
    包含点位: [合规异常]
  4:
    异常类型: "已发生实际损失"
    包含点位: [滞销异常]
  5:
    异常类型: "交易表现/信任损失"
    包含点位:
      - 销量异常
      - 链接转化率异常下降
      - ACOS异常
      - 广告花费异常
      - 目标偏离
      - 自然流量异常
      - 卡位异常
      - 评分异常
  6:
    异常类型: "库存积压"
    包含点位: [库存积压]
  7:
    异常类型: "内容"
    包含点位: [主图异常, 标题异常, 五点异常, 图片异常, A+异常]
  8:
    异常类型: "价格"
    包含点位: [促销异常, 变体价差异常]
  9:
    异常类型: "合规潜在风险/属性问题"
    包含点位: [类目异常, 属性信息异常]
  10:
    异常类型: "售后其余风险"
    包含点位: [近期集中差评, 退款异常]
  11:
    异常类型: "机会型"
    包含点位: [销量增长提示, 放量未执行]

# -----------------------------------------------------------------------------
# §4.8 完整算例（单元测试用，不参与线上逻辑）
# -----------------------------------------------------------------------------
单元测试算例:
  - 名称: "T1收割旺季前期_主要色断货+长尾色图片"
    输入产品:
      定位: T1
      阶段: 收割利润
      淡旺季: 旺季前期
    输入异常:
      - 点位: "FBA可售库存为0"
        严重度: S0
        作用层级: 变体级
        变体重要性: 主要色
        预期基础分: 100
        预期单异常分: 187.2         # 100 × 1.2 × 1.3 × 1.2
      - 点位: "图片异常"
        严重度: S1
        作用层级: 变体级
        变体重要性: 长尾色
        预期基础分: 15
        预期单异常分: 28.08         # 15 × 1.2 × 1.3 × 1.2
    预期产品执行分数: 192.82        # 187.2 + 28.08 × 0.2
    预期执行优先级: P0
    预期父卡严重度: S0
