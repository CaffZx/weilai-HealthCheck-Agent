# =============================================================================
# R6 处理建议话术库
#
# 设计原则：
#   - 具体表现：4-8 字短标签，前端"具体表现"列用（一眼看懂是什么问题）
#   - 判断依据：简洁说明哪个指标检查有问题
#   - 处理建议：一句话动作指引
#   - 广告类异常：统一建议到广告辅助决策agent检查
#   - 缺占位符时 suggestion_picker 用 "—" 兜底
# =============================================================================

# -----------------------------------------------------------------------------
# §2.1 链接状态
# -----------------------------------------------------------------------------
链接不可售:
  具体表现: "链接不可售"
  判断依据: "链接不可售，无法正常购买"
  处理建议: "检查后台可售状态并尽快恢复"

Buy Box丢失:
  具体表现: "Buy Box丢失"
  判断依据: "Buy Box 丢失"
  处理建议: "核查跟卖/定价/物流表现，夺回 Buy Box"

父子体关系异常:
  具体表现: "父子挂接异常"
  判断依据: "父子体挂接关系异常"
  处理建议: "恢复父体结构和子体挂接，避免变体流量断层"

变体掉线:
  具体表现: "变体掉线"
  判断依据: "{变体重要性}子体 {命中变体} 变体掉线"
  处理建议: "检查属性/图片/价格是否触发平台拆分，重新关联至父体"

# -----------------------------------------------------------------------------
# §2.2 内容完整性
# -----------------------------------------------------------------------------
主图异常:
  具体表现: "主图不合规"
  判断依据: "{变体重要性}子体 {命中变体} 主图不合规"
  处理建议: "重新上传合规主图"

图片异常:
  具体表现: "副图不达标"
  判断依据: "{变体重要性}子体 {命中变体} 副图不达标"
  处理建议: "补充至少 3 张以上副图"

标题异常:
  具体表现: "标题不合规"
  判断依据: "标题不合规"
  处理建议: "按品类关键词规范补齐标题"

五点异常:
  具体表现: "五点不达标"
  判断依据: "五点描述不达标"
  处理建议: "补齐至 5 条五点描述"

A+异常:
  具体表现: "A+内容异常"
  判断依据: "{变体重要性}子体 {命中变体} A+ 内容异常"
  处理建议: "重新提交 A+ 内容并确认审核通过"

# -----------------------------------------------------------------------------
# §2.3 价格与促销
# -----------------------------------------------------------------------------
变体价差异常:
  尺码:
    具体表现: "尺码价差偏离"
    判断依据: "{变体重要性}子体 {命中变体} 价格偏离同色系基准"
    处理建议: "核查定价依据，拉齐至与其他尺码接近水平"
  颜色:
    具体表现: "颜色价差偏离"
    判断依据: "{变体重要性}子体 {命中变体} 价格偏离主要色基准"
    处理建议: "确认是否清货/新品；若非，靠拢主要色定价"

促销异常:
  具体表现: "促销展示异常"
  判断依据: "促销活动异常"
  处理建议: "核对 ERP 活动配置与前台展示是否一致"

# -----------------------------------------------------------------------------
# §2.4 库存
# -----------------------------------------------------------------------------
"FBA可售库存为0":
  具体表现: "FBA已断货"
  判断依据: "{变体重要性}子体 {命中变体} FBA 可售库存为 0，已断货"
  处理建议: "尽快安排补货，暂停相关广告投放"

库存不足:
  具体表现: "库存即将售罄"
  判断依据: "{变体重要性}子体 {命中变体} FBA 可售库存不足，即将售罄"
  处理建议: "尽快补货，短期无法到仓则降低广告花费"

库存积压:
  具体表现: "库存积压"
  判断依据: "库存周转天数偏高，库存积压"
  处理建议: "开活动清库存或降广告投放，必要时申请移仓"

滞销异常:
  具体表现: "产品滞销"
  判断依据: "产品处于滞销状态"
  处理建议: "评估是否清货或加大促销力度"

# -----------------------------------------------------------------------------
# §2.5 表现型（广告类异常 → 建议到广告辅助决策agent检查）
# -----------------------------------------------------------------------------
链接转化率异常下降:
  具体表现: "转化率下降"
  判断依据: "链接转化率明显下降"
  处理建议: "排查价格/评分/竞品变化"

销量异常:
  具体表现: "销量异常波动"
  判断依据: "销量相较基准明显变化"
  处理建议: "结合广告花费、卡位、库存和竞品排查具体原因"

销量增长提示:
  具体表现: "销量明显增长"
  判断依据: "销量出现明显增长趋势"
  处理建议: "加强补货规划、提高广告预算承接增长"

ACOS异常:
  具体表现: "ACOS偏离目标"
  判断依据: "ACOS指标异常，相较基准明显偏离"
  处理建议: "建议到广告辅助决策agent检查"

广告花费异常:
  具体表现: "花费偏离预算"
  判断依据: "广告花费指标异常，相较近期均值明显偏离"
  处理建议: "建议到广告辅助决策agent检查"

目标偏离:
  具体表现: "单量偏离目标"
  判断依据: "日均单量与目标偏离"
  处理建议: "若达成率偏低加大广告或调整定价；若超达评估补货"

自然流量异常:
  具体表现: "自然占比下降"
  判断依据: "自然订单占比下降，广告依赖度过高"
  处理建议: "排查关键词排名/卡位变化，回归自然运营"

卡位异常:
  具体表现: "卡位下滑"
  判断依据: "关键词平均卡位下滑"
  处理建议: "建议到广告辅助决策agent检查"

放量未执行:
  具体表现: "放量未执行"
  判断依据: "已触发放量条件但未执行放量"
  处理建议: "建议到广告辅助决策agent检查"

# -----------------------------------------------------------------------------
# §2.6 合规 / 类目 / 属性
# -----------------------------------------------------------------------------
类目异常:
  具体表现: "类目不匹配"
  判断依据: "商品类目与基准不匹配"
  处理建议: "修正商品类目，恢复正确曝光路径"

属性信息异常:
  具体表现: "属性缺失/错误"
  判断依据: "关键属性缺失或与基准不一致"
  处理建议: "补齐或修正属性字段"

合规异常:
  具体表现: "合规异常"
  判断依据: "{变体重要性}子体 {命中变体} 合规异常"
  处理建议: "按平台要求补齐认证/标识"

# -----------------------------------------------------------------------------
# §2.7 评价 / 退款
# -----------------------------------------------------------------------------
近期集中差评:
  具体表现: "集中差评"
  判断依据: "近期出现多条集中差评"
  处理建议: "排查根因（品质/物流/尺码），必要时下架送检"

评分异常:
  具体表现: "评分下滑"
  判断依据: "评分相较基准下滑"
  处理建议: "拉齐品控和文案预期，持续下滑评估是否重开链接"

退款异常:
  具体表现: "退款率偏高"
  判断依据: "退款率相较基准明显上升"
  处理建议: "分析退款主因（品质/描述不符/物流），针对性优化"
