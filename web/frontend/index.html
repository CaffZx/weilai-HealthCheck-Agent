<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>weilai-HealthCheck-Agent · 本地测试台</title>
<style>
  *{box-sizing:border-box}
  :root{--indigo:#6366f1;--indigo-d:#4f46e5;--slate:#0f172a}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f5f7;color:#1c2126;animation:fadeIn .4s ease}
  header{background:linear-gradient(90deg,#1e293b,#334155);color:#fff;padding:10px 20px;font-weight:600;display:flex;gap:16px;align-items:center}
  header .tag{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:400}
  .layout{display:grid;grid-template-columns:minmax(160px,200px) minmax(260px,340px) minmax(0,1fr);height:calc(100vh - 43px);transition:grid-template-columns .34s cubic-bezier(.4,0,.2,1)}
  .layout.kb-collapsed{grid-template-columns:46px minmax(260px,340px) minmax(0,1fr)}
  /* 收起竖条：默认隐藏，收起态显示 */
  .kb-col{position:relative;overflow:hidden}
  .kb-strip{display:none}
  .layout.kb-collapsed .kb-col>h3,
  .layout.kb-collapsed .kb-col>.list{opacity:0;pointer-events:none;transition:opacity .12s}
  .layout.kb-collapsed .kb-strip{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    position:absolute;inset:0;padding-top:16px;cursor:pointer;
    background:linear-gradient(180deg,#f8fafc,#eef2ff);border-right:1px solid #e2e5ea;
    animation:fadeIn .3s ease .1s both}
  .kb-strip:hover{background:linear-gradient(180deg,#eef2ff,#e0e7ff)}
  .kb-strip .strip-icon{font-size:18px}
  .kb-strip .strip-text{writing-mode:vertical-rl;letter-spacing:3px;font-size:12px;color:#475569;font-weight:600;white-space:nowrap}
  .kb-strip .strip-caret{margin-top:auto;margin-bottom:14px;color:#6366f1;font-size:14px;animation:pulse 1.8s ease-in-out infinite}
  .collapse-hint{margin-left:auto;font-size:10px;color:#cbd5e1;font-weight:400;transition:color .15s}
  .col-head:hover .collapse-hint{color:#6366f1}
  .col{overflow:auto;background:#fff;border-right:1px solid #e2e5ea}
  .col:last-child{border-right:none;background:#fafbfc}
  .col h3{margin:0;padding:12px 14px 8px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600;position:sticky;top:0;background:#fff;border-bottom:1px solid #eef1f5;z-index:1}
  .col:last-child h3{background:#fafbfc}
  .list{padding:6px 8px}
  .item{display:block;padding:8px 10px;margin:2px 0;background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer;text-align:left;width:100%;font-size:13px;color:#334155;transition:all .18s cubic-bezier(.4,0,.2,1)}
  .item:hover{background:#eef2ff;border-color:#c7d2fe;transform:translateX(2px)}
  .item.active{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-color:#818cf8;color:#3730a3;font-weight:500;box-shadow:0 2px 6px rgba(99,102,241,.15)}
  .item:active{transform:scale(.98)}
  .item .meta{display:block;font-size:11px;color:#94a3b8;margin-top:2px}
  .item.active .meta{color:#6366f1}
  .badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-right:4px;font-weight:500}
  .b-stage{background:#dbeafe;color:#1e40af}
  .b-pos{background:#fef3c7;color:#92400e}
  .b-site{background:#dcfce7;color:#166534}
  .filter{padding:8px 10px;border-bottom:1px solid #eef1f5;position:sticky;top:32px;background:#fff;z-index:1}
  .filter input{width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;outline:none}
  .filter input:focus{border-color:#818cf8}
  .filter-row{display:flex;gap:5px;margin-top:6px}
  .filter-row select{flex:1;min-width:0;padding:4px 4px;border:1px solid #cbd5e1;border-radius:5px;font-size:11px;background:#fff;cursor:pointer}
  .filter-row select:focus{border-color:#818cf8;outline:none}
  .filter-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:#94a3b8}
  .chk{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
  .chk input{width:auto}
  /* 折叠知识库 */
  .col-head{cursor:pointer;user-select:none;transition:color .15s}
  .col-head:hover{color:#6366f1}
  .caret{display:inline-block;transition:transform .2s;font-size:10px}
  .kb-item{display:flex;align-items:center;gap:8px}
  .kb-num{background:#eef2ff;color:#6366f1;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;min-width:18px;text-align:center}
  /* ASIN 项优化 */
  .asin-item{padding:8px 10px}
  .asin-line1{display:flex;align-items:center;gap:6px;font-size:13px}
  .asin-line2{font-size:11px;color:#64748b;margin-top:1px}
  .asin-score{margin-left:auto;font-size:11px;color:#94a3b8;font-weight:600}
  .asin-item.judged{border-left:3px solid transparent}
  .pri-dot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:16px;border-radius:3px;font-size:10px;font-weight:700;color:#fff}
  .pri-P0{background:#dc2626}.pri-P1{background:#ea580c}.pri-P2{background:#0891b2}
  .content{padding:16px 20px}
  .tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid #e2e5ea}
  .tab{padding:6px 14px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:13px;color:#64748b}
  .tab:hover{color:#3730a3}
  .tab.active{color:#3730a3;border-bottom-color:#6366f1;font-weight:500}
  pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;font:12px/1.6 "SF Mono",Monaco,monospace;margin:0;max-height:calc(100vh - 200px)}
  .md{background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);font:13px/1.7 -apple-system,sans-serif;max-height:calc(100vh - 200px);overflow:auto;word-break:break-word}
  .md p{margin:.4em 0}
  .md h1,.md h2,.md h3{margin:1em 0 .5em}
  .md h1{font-size:20px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:6px}
  .md h2{font-size:16px;color:#1e293b}
  .md h3{font-size:14px;color:#334155}
  .md table{border-collapse:collapse;margin:8px 0;background:#f8fafc}
  .md th,.md td{border:1px solid #e2e8f0;padding:6px 10px;font-size:12px;text-align:left}
  .md th{background:#f1f5f9;font-weight:600}
  .card{background:#fff;padding:14px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:10px;animation:fadeUp .35s cubic-bezier(.4,0,.2,1) both;transition:box-shadow .2s}
  .card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .card:nth-child(4){animation-delay:.15s}
  .card:nth-child(5){animation-delay:.2s}
  .card h4{margin:0 0 8px;font-size:12px;color:#64748b;text-transform:uppercase;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .kv{background:#f8fafc;padding:6px 10px;border-radius:6px;font-size:12px}
  .kv .k{color:#64748b;display:block;margin-bottom:2px}
  .kv .v{font-weight:500;color:#0f172a;word-break:break-all}
  .kv .v.none{color:#cbd5e1;font-style:italic;font-weight:400}
  .placeholder{color:#94a3b8;text-align:center;padding:60px 20px;font-size:13px}
  .run-btn{background:linear-gradient(135deg,var(--indigo),var(--indigo-d));color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;box-shadow:0 2px 6px rgba(99,102,241,.3);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
  .run-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.4)}
  .run-btn:active{transform:translateY(0)}
  .run-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .md{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both}
  .placeholder{animation:pulse 2s ease-in-out infinite}
  .badge{transition:transform .15s}
  .item:hover .badge{transform:scale(1.03)}
  header .tag{transition:background .2s}
  header:hover .tag{background:rgba(255,255,255,.25)}

  /* 判定结果卡片 */
  .judge-card{background:linear-gradient(180deg,#fff,#fafbff)}
  .judge-hero{padding:14px 16px;border-radius:10px;margin-bottom:14px;animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both}
  .judge-hero-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .pri-badge{color:#fff;padding:4px 12px;border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .pri-label{font-weight:600;color:#0f172a;font-size:14px}
  .judge-score{margin-left:auto;font-size:12px;color:#475569}
  .judge-score b{font-size:18px;color:#0f172a;margin-left:4px}
  .judge-headline{font-size:16px;font-weight:600;color:#0f172a;margin:6px 0 4px;line-height:1.4}
  .judge-summary{font-size:13px;color:#334155;line-height:1.7;margin-bottom:10px}
  .score-bar{height:6px;background:rgba(255,255,255,.5);border-radius:3px;overflow:hidden}
  .score-bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}

  .section-title{font-size:12px;color:#475569;font-weight:600;margin:14px 0 8px;text-transform:none;letter-spacing:.3px}
  .anomaly-list{display:flex;flex-direction:column;gap:8px}
  /* 模块7 异常明细卡 */
  .anom-card{background:#fff;border:1px solid #eef1f5;border-left:3px solid #cbd5e1;border-radius:8px;padding:10px 12px;animation:slideIn .3s ease both;transition:box-shadow .15s}
  .anom-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .anom-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .anom-idx{width:18px;height:18px;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .anom-title{font-size:13px;color:#0f172a;flex:1;min-width:0}
  .anom-score{font-size:12px;color:#94a3b8;font-weight:600;white-space:nowrap}
  .anom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:5px;margin-bottom:8px}
  .anom-field{display:flex;gap:8px;font-size:12px;line-height:1.6;padding:3px 0}
  .anom-field .af-k{color:#94a3b8;flex-shrink:0;width:52px}
  .anom-field .af-v{color:#334155;flex:1}
  .af-action{background:#f0f9ff;border-radius:6px;padding:6px 8px;margin-top:2px}
  .af-action .af-v{color:#0c4a6e;font-weight:500}
  .anom-foot{display:flex;gap:16px;margin-top:6px;padding-top:6px;border-top:1px dashed #eef1f5;font-size:11px;color:#94a3b8}
  .anomaly-old-unused{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:8px;border-left:3px solid #cbd5e1;transition:transform .15s,box-shadow .15s;animation:slideIn .3s ease both}
  .anomaly{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:8px;border-left:3px solid #cbd5e1;transition:transform .15s,box-shadow .15s;animation:slideIn .3s ease both}
  .anomaly:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .sev-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .anomaly-body{flex:1;min-width:0}
  .anomaly-name{font-weight:500;color:#0f172a;font-size:13px}
  .anomaly-cat{font-weight:400;color:#94a3b8;font-size:11px;margin-left:6px}
  .anomaly-reason{color:#475569;font-size:12px;margin-top:3px;line-height:1.5}
  .anomaly-score{font-size:12px;color:#64748b;white-space:nowrap;align-self:center}
  .actions-list{margin:0;padding-left:20px;color:#334155;font-size:13px;line-height:1.7}
  .task-card{background:#f0f9ff;border-left:3px solid #0284c7;padding:10px 12px;border-radius:8px}
  .task-card-title{font-weight:600;color:#0c4a6e;font-size:13px}
  .task-card-brief{color:#475569;font-size:12px;margin-top:4px;line-height:1.5}
  .judge-meta{margin-top:12px;font-size:11px;color:#94a3b8;text-align:right}

  /* 批量判定 */
  .batch-btn{margin-left:12px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:5px;cursor:pointer;font-size:13px;transition:all .18s}
  .batch-btn:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
  .batch-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;align-items:center;justify-content:center;animation:fadeIn .2s}
  .batch-mask.open{display:flex}
  .batch-modal{background:#fff;border-radius:12px;width:min(1000px,92vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeUp .3s cubic-bezier(.4,0,.2,1)}
  .batch-head{padding:18px 22px;border-bottom:1px solid #eef1f5;display:flex;justify-content:space-between;align-items:flex-start}
  .batch-toolbar{padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#f8fafc;border-bottom:1px solid #eef1f5}
  .batch-toolbar label{font-size:12px;color:#475569;display:flex;align-items:center;gap:6px}
  .batch-toolbar select{padding:4px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;background:#fff}
  .mini-btn{background:#fff;color:#334155;border:1px solid #cbd5e1;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;transition:all .15s}
  .mini-btn:hover{background:#f1f5f9;border-color:#94a3b8}
  .batch-progress{padding:8px 22px;font-size:12px;color:#475569;background:#fafbfc;min-height:0}
  .batch-progress .bar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-top:6px}
  .batch-progress .bar-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--indigo-d));transition:width .3s}
  .batch-table-wrap{overflow:auto;flex:1;padding:0 22px 22px}
  .batch-table{width:100%;border-collapse:collapse;font-size:13px}
  .batch-table th{background:#f8fafc;text-align:left;padding:8px 10px;font-weight:600;color:#475569;font-size:12px;position:sticky;top:0}
  .batch-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
  .batch-table tr{transition:background .15s}
  .batch-table tr:hover{background:#fafbff}
  .pri-mini{color:#fff;padding:2px 7px;border-radius:3px;font-weight:600;font-size:11px}
  .batch-row-pending td{color:#94a3b8}
  .batch-row-running td{background:linear-gradient(90deg,#fff,#eef2ff,#fff);background-size:400px 100%;animation:shimmer 1.4s linear infinite}
  .batch-row-error td{color:#dc2626;background:#fef2f2}
</style>
</head>
<body>
<header>
  🩺 业务巡检 Agent
  <span class="tag">本地测试台</span>
  <span class="tag" id="stat">加载中…</span>
  <button class="batch-btn" onclick="openBatch()">📊 批量判定</button>
  <span style="margin-left:auto;font-size:11px;opacity:.7">weilai-HealthCheck-Agent</span>
</header>

<!-- 批量判定弹层 -->
<div id="batch-mask" class="batch-mask" onclick="if(event.target===this) closeBatch()">
  <div class="batch-modal">
    <div class="batch-head">
      <div>
        <h2 style="margin:0;font-size:16px">📊 批量判定</h2>
        <div style="font-size:12px;color:#64748b;margin-top:4px">对多个 ASIN 并行运行判定，每个约 15-30 秒</div>
      </div>
      <button onclick="closeBatch()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#64748b">✕</button>
    </div>
    <div class="batch-toolbar">
      <label>数量
        <select id="batch-limit" onchange="refreshBatchTable()"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="70">全部 70</option></select>
      </label>
      <label>并发
        <select id="batch-conc"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option></select>
      </label>
      <label>范围
        <select id="batch-scope" onchange="refreshBatchTable()">
          <option value="filter">当前过滤结果</option>
          <option value="all">所有 ASIN</option>
          <option value="uncached">未跑过的</option>
        </select>
      </label>
      <button class="run-btn" id="batch-run-btn" onclick="runBatch()">▶ 开始批量判定</button>
      <button class="mini-btn" onclick="exportBatch()">⬇ 导出 CSV</button>
    </div>
    <div class="batch-progress" id="batch-progress"></div>
    <div class="batch-table-wrap"><table class="batch-table" id="batch-table">
      <thead><tr><th>ASIN</th><th>店铺</th><th>优先级</th><th>处理时限</th><th>分数</th><th>结论</th><th>操作</th></tr></thead>
      <tbody id="batch-tbody"></tbody>
    </table></div>
  </div>
</div>
<div class="layout kb-collapsed">
  <!-- 知识库模块 -->
  <div class="col kb-col" id="kb-col">
    <h3 class="col-head" onclick="toggleKb()" title="收起知识库">
      <span id="kb-caret" class="caret">▸</span> 知识库模块
      <span class="collapse-hint">收起 ⇤</span>
    </h3>
    <div class="list" id="kb-list"></div>
    <!-- 收起后的竖条 -->
    <div class="kb-strip" onclick="toggleKb()" title="展开知识库">
      <span class="strip-icon">📚</span>
      <span class="strip-text">知识库模块</span>
      <span class="strip-caret">▸</span>
    </div>
  </div>

  <!-- ASIN -->
  <div class="col">
    <h3>采样 ASIN</h3>
    <div class="filter">
      <input id="q" placeholder="🔍 过滤 ASIN / SKU / 店铺 …"/>
      <div class="filter-row">
        <select id="f-priority" onchange="renderAsins()">
          <option value="">全部优先级</option>
          <option value="P0">🔴 P0 当天</option>
          <option value="P1">🟠 P1 三天</option>
          <option value="P2">🔵 P2 七天</option>
          <option value="__none">⚪ 未判定</option>
        </select>
        <select id="f-site" onchange="renderAsins()"><option value="">全部站点</option></select>
        <select id="f-stage" onchange="renderAsins()"><option value="">全部阶段</option></select>
      </div>
      <div class="filter-meta">
        <label class="chk"><input type="checkbox" id="f-sortpri" checked onchange="renderAsins()"> 按优先级排序</label>
        <span id="asin-count"></span>
      </div>
    </div>
    <div class="list" id="asin-list"></div>
  </div>

  <!-- 内容展示 -->
  <div class="col">
    <h3 id="viewer-title">详情</h3>
    <div class="content" id="viewer">
      <div class="placeholder">← 从左侧选一个知识库模块，或从中间选一个 ASIN 查看详情</div>
    </div>
  </div>
</div>

<script>
const state = { kbActive: null, asinActive: null, dataTab: 'summary' };
// 判定结果缓存：切换 ASIN 后回来还能看到上次结果
const judgeCache = new Map();  // key -> {result, ts}

// 产品定位 / 阶段 中文映射（ERP 枚举 → 展示名）
const POS_CN = {
  P0_PRODUCT: '战略级产品 (P0)', P1_PRODUCT: '重点产品 (P1)',
  P2_PRODUCT: '常规产品 (P2)', P3_PRODUCT: '长尾产品 (P3)',
};
const STAGE_CN = {
  TESTING: '测试期', PROMOTING: '推进期', HARVEST_PROFIT: '收割利润期',
  MAINTAINING: '维持期', LIQUIDATING: '清货期', 清货期: '清货期',
};
const posCN = v => POS_CN[v] || v || '-';
const stageCN = v => STAGE_CN[v] || v || '-';

async function api(path){ const r = await fetch(path); return r.json(); }

function renderMd(src){
  // 极简 markdown 渲染（够看即可）
  const lines = src.split('\n');
  let out = [], inTable = false, tableRows = [];
  for (const L of lines){
    if (/^\| /.test(L)){
      if (!inTable){ inTable = true; tableRows = []; }
      tableRows.push(L);
      continue;
    } else if (inTable){
      out.push(renderTable(tableRows));
      inTable = false;
    }
    if (/^### /.test(L)) out.push('<h3>'+esc(L.slice(4))+'</h3>');
    else if (/^## /.test(L)) out.push('<h2>'+esc(L.slice(3))+'</h2>');
    else if (/^# /.test(L)) out.push('<h1>'+esc(L.slice(2))+'</h1>');
    else if (L.trim()==='') out.push('');
    else out.push('<p>'+esc(L)+'</p>');
  }
  if (inTable) out.push(renderTable(tableRows));
  return out.join('\n');
}

function renderTable(rows){
  if (!rows.length) return '';
  const parse = r => r.slice(1,-1).split('|').map(c=>c.trim());
  const head = parse(rows[0]);
  const body = rows.slice(rows.length>1 && /^\| *[-: ]+ *\|/.test(rows[1]) ? 2 : 1).map(parse);
  return '<table><thead><tr>'+head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>'
    + body.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('') + '</tbody></table>';
}

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let allAsins = [];
const PRI_ORDER = { P0: 0, P1: 1, P2: 2 };

function priOf(key){
  const c = judgeCache.get(key);
  return c && !c.result.dry_run ? (pickPriority(c.result.judgment) || null) : null;
}

async function loadAsins(){
  allAsins = await api('/api/asins');
  document.getElementById('stat').textContent = allAsins.length + ' 个 ASIN · ' + (await api('/api/knowledge')).modules.length + ' 个知识模块';
  // 填充站点/阶段筛选下拉
  const sites = [...new Set(allAsins.map(a=>a.site_code).filter(Boolean))].sort();
  const stages = [...new Set(allAsins.map(a=>stageCN(a.product_stage)).filter(v=>v&&v!=='-'))].sort();
  document.getElementById('f-site').insertAdjacentHTML('beforeend', sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join(''));
  document.getElementById('f-stage').insertAdjacentHTML('beforeend', stages.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join(''));
  renderAsins();
}

function renderAsins(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fp = document.getElementById('f-priority').value;
  const fs = document.getElementById('f-site').value;
  const fst = document.getElementById('f-stage').value;
  const sortPri = document.getElementById('f-sortpri').checked;
  const box = document.getElementById('asin-list');
  box.innerHTML = '';

  let rows = allAsins.filter(a => {
    if (q && ![a.parent_asin, a.parent_seller_sku, a.shop_account, a.site_code, a.product_stage]
        .filter(Boolean).some(v => String(v).toLowerCase().includes(q))) return false;
    if (fs && a.site_code !== fs) return false;
    if (fst && stageCN(a.product_stage) !== fst) return false;
    if (fp){
      const p = priOf(a.key);
      if (fp === '__none') { if (p) return false; }
      else if (p !== fp) return false;
    }
    return true;
  });

  if (sortPri){
    rows.sort((a,b) => {
      const pa = priOf(a.key), pb = priOf(b.key);
      const oa = pa ? PRI_ORDER[pa] : 9, ob = pb ? PRI_ORDER[pb] : 9;
      if (oa !== ob) return oa - ob;
      // 同档按分数降序
      const sa = pickScore(judgeCache.get(a.key)?.result?.judgment) ?? -1;
      const sb = pickScore(judgeCache.get(b.key)?.result?.judgment) ?? -1;
      return sb - sa;
    });
  }

  document.getElementById('asin-count').textContent = `${rows.length} / ${allAsins.length}`;

  rows.forEach(a => {
    const p = priOf(a.key);
    const score = pickScore(judgeCache.get(a.key)?.result?.judgment);
    const priTag = p ? `<span class="pri-dot pri-${p}">${p}</span>` : '';
    const b = el(`
      <button class="item asin-item ${p?'judged':''}" data-key="${a.key}">
        <div class="asin-line1">${priTag}<b>${esc(a.parent_asin||'-')}</b>${score!=null?`<span class="asin-score">${score}</span>`:''}</div>
        <div class="asin-line2">${esc(a.shop_account||'?')}</div>
        <span class="meta">
          <span class="badge b-site">${esc(a.site_code||'')}</span>
          <span class="badge b-stage">${esc(stageCN(a.product_stage))}</span>
          <span class="badge b-pos">${esc(posCN(a.product_position))}</span>
        </span>
      </button>`);
    b.onclick = () => viewAsin(a, b);
    box.appendChild(b);
  });
}

document.getElementById('q').addEventListener('input', renderAsins);

const SEV_META = {
  S0: {color:'#dc2626', bg:'#fee2e2', label:'S0 严重'},
  S1: {color:'#ea580c', bg:'#ffedd5', label:'S1 中等'},
  S2: {color:'#0891b2', bg:'#cffafe', label:'S2 轻微'},
};
const PRI_META = {
  P0: {color:'#dc2626', bg:'linear-gradient(135deg,#fee2e2,#fecaca)', label:'当天处理'},
  P1: {color:'#ea580c', bg:'linear-gradient(135deg,#ffedd5,#fed7aa)', label:'3 天内处理'},
  P2: {color:'#0891b2', bg:'linear-gradient(135deg,#cffafe,#a5f3fc)', label:'7 天内处理'},
};

// —— 从判定结果里取字段（兼容模块7新结构 + 旧结构）——
function pickPriority(j){ return j?.优先级信息?.执行优先级 || j?.priority || null; }
function pickScore(j){ const v=j?.优先级信息?.产品执行分数 ?? j?.product_execution_score; return v==null?null:v; }
function pickAnomalies(j){ return j?.异常明细 || j?.anomalies || []; }
function anomScore(a){ return a?.该条执行分数 ?? a?.final_score ?? a?.base_score ?? -1; }

function kvRow(label, val){
  const empty = (val==null || val==='' );
  return `<div class="kv"><span class="k">${esc(label)}</span><span class="v${empty?' none':''}">${esc(String(val??'待补充'))}</span></div>`;
}

function renderJudgment(j, usage, model){
  const P = pickPriority(j) || 'P2';
  const pm = PRI_META[P] || PRI_META.P2;
  const score = pickScore(j);
  const scorePct = Math.min(100, Math.max(0, (Number(score) || 0) / 150 * 100));
  const headline = j.headline || '';
  const summary = j.human_summary || '';

  const loc = j.定位信息 || {};
  const pri = j.优先级信息 || {};

  // 异常明细按该条执行分数降序（模块7.2）
  const anomalies = pickAnomalies(j).slice().sort((a,b)=>anomScore(b)-anomScore(a));
  const isPerf = (t) => /交易表现|售后/.test(t||'');

  const anomHtml = anomalies.map((a,i) => {
    const sev = a.该条严重度 || a.severity || 'S2';
    const sm = SEV_META[sev] || SEV_META.S2;
    const type = a.异常类型 || a.category || '';
    const point = a.问题点位 || a.code || '-';
    const reason = a.初步原因;
    const showReason = reason && reason!=='不适用' && isPerf(type);
    return `<div class="anom-card">
      <div class="anom-head">
        <span class="anom-idx">${i+1}</span>
        <span class="sev-tag" style="background:${sm.bg};color:${sm.color}">${sm.label}</span>
        <span class="anom-title">${esc(type)} · <b>${esc(point)}</b></span>
        <span class="anom-score">${anomScore(a)>=0?anomScore(a)+' 分':''}</span>
      </div>
      <div class="anom-grid">
        ${kvRow('命中变体', a.命中变体)}
        ${kvRow('变体重要性', a.变体重要性)}
        ${kvRow('作用层级', a.作用层级)}
        ${kvRow('异常状态', a.异常状态)}
      </div>
      <div class="anom-field"><span class="af-k">判断依据</span><span class="af-v">${esc(a.判断依据||a.plain_reason||'待补充')}</span></div>
      ${showReason?`<div class="anom-field"><span class="af-k">初步原因</span><span class="af-v">${esc(reason)}</span></div>`:''}
      <div class="anom-field af-action"><span class="af-k">处理建议</span><span class="af-v">${esc(a.处理建议||'待补充')}</span></div>
      <div class="anom-foot">
        <span>上次处理：${esc(a.上次处理记录||'无')}</span>
        <span>复查：${esc(a.复查要求||'待补充')}</span>
      </div>
    </div>`;
  }).join('') || '<div style="color:#94a3b8;font-size:12px;padding:6px 0">未识别到异常</div>';

  return `
    <div class="judge-hero" style="background:${pm.bg}">
      <div class="judge-hero-top">
        <span class="pri-badge" style="background:${pm.color}">${esc(P)}</span>
        <span class="pri-label">${esc(pri.处理时限||pm.label)}</span>
        <span class="judge-score">执行分 <b>${score ?? '-'}</b> · 父卡严重度 ${esc(pri.父卡严重度||'-')}</span>
      </div>
      <div class="judge-headline">${esc(headline)}</div>
      <div class="judge-summary">${esc(summary)}</div>
      <div class="score-bar"><div class="score-bar-fill" style="width:${scorePct}%;background:${pm.color}"></div></div>
    </div>

    <div class="section-title">📍 定位信息</div>
    <div class="card"><div class="grid">
      ${kvRow('店铺/站点', loc.店铺站点)}
      ${kvRow('负责人', loc.负责人)}
      ${kvRow('产品定位', loc.产品定位)}
      ${kvRow('产品阶段', loc.产品阶段)}
      ${kvRow('淡旺季', loc.淡旺季)}
      ${kvRow('下次复查', pri.下一次复查时间)}
      ${kvRow('当前状态', pri.当前状态)}
    </div></div>

    <div class="section-title">🎯 异常明细（${anomalies.length} 项，按执行分数降序）</div>
    <div class="anomaly-list">${anomHtml}</div>

    <div class="judge-meta">模型 ${esc(model||'-')} · 输入 ${usage?.input_tokens ?? '-'} tokens · 输出 ${usage?.output_tokens ?? '-'} tokens</div>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-size:11px;color:#94a3b8">查看原始 JSON</summary>
    <pre style="max-height:300px;margin-top:6px">${esc(JSON.stringify(j, null, 2))}</pre></details>
  `;
}

async function runJudge(key){
  const box = document.getElementById('judge-result');
  const btn = document.querySelector('.run-btn');
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 判定中…'; }
  box.innerHTML = '<div style="color:#64748b;animation:pulse 1.4s ease-in-out infinite">📊 拼装 prompt · 调用 DeepSeek…</div>';
  try {
    const r = await fetch('/api/judge/' + encodeURIComponent(key), {method:'POST'}).then(r=>r.json());
    if (r.dry_run){
      box.innerHTML = `<div style="background:#fef3c7;padding:10px 12px;border-radius:6px;color:#92400e;font-size:12px">
        ⚠️ ${esc(r.note)}<br>提示词长度：system ${r.system_length} 字符 · user ${r.user_length} 字符
        </div>
        <details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:#475569">查看即将发送的提示词</summary>
        <pre style="max-height:400px;margin-top:6px">${esc(r.system_preview + '\n\n===用户消息===\n' + r.user_preview)}</pre>
        </details>`;
    } else {
      judgeCache.set(key, {result: r, ts: Date.now()});
      box.innerHTML = renderJudgment(r.judgment || {}, r.usage, r.model);
      renderAsins();  // 刷新左列优先级排序/筛选
    }
  } catch(e) {
    box.innerHTML = `<div style="color:#dc2626">错误：${esc(String(e))}</div>`;
  } finally {
    if (btn){ btn.disabled = false; btn.innerHTML = '🔍 重新运行判定'; }
  }
}

// ------- 批量判定 -------
function refreshBatchTable(){
  const scope = document.getElementById('batch-scope').value;
  const limit = parseInt(document.getElementById('batch-limit').value);
  const list = pickBatch(scope, limit);
  renderBatchTable(list);
  const prog = document.getElementById('batch-progress');
  if (prog && !prog.querySelector('.bar')){
    const cached = list.filter(a => judgeCache.has(a.key)).length;
    prog.innerHTML = `待判定 <b>${list.length}</b> 个 · 其中已缓存 <b>${cached}</b> 个（会直接复用）`;
  }
}
function openBatch(){
  document.getElementById('batch-mask').classList.add('open');
  refreshBatchTable();
}
function closeBatch(){ document.getElementById('batch-mask').classList.remove('open'); }

function pickBatch(scope, limit){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = allAsins.slice();
  if (scope === 'filter' && q){
    list = list.filter(a =>
      [a.parent_asin, a.parent_seller_sku, a.shop_account, a.site_code, a.product_stage]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q))
    );
  } else if (scope === 'uncached'){
    list = list.filter(a => !judgeCache.has(a.key));
  }
  return list.slice(0, limit);
}

function renderBatchTable(list){
  const tbody = document.getElementById('batch-tbody');
  tbody.innerHTML = list.map(a => {
    const cached = judgeCache.get(a.key);
    if (cached) return rowHtml(a, cached.result.judgment, 'done');
    return `<tr data-key="${a.key}" class="batch-row-pending">
      <td><b>${esc(a.parent_asin||'-')}</b></td>
      <td>${esc(a.shop_account||'')}</td>
      <td colspan="4">待判定</td>
      <td><button class="mini-btn" onclick="goToAsin('${a.key}')">跳转</button></td>
    </tr>`;
  }).join('');
}

function rowHtml(a, j, status){
  const P = pickPriority(j) || 'P2';
  const pm = PRI_META[P] || PRI_META.P2;
  const 时限 = j?.优先级信息?.处理时限 || pm.label;
  return `<tr data-key="${a.key}" class="batch-row-${status}">
    <td><b>${esc(a.parent_asin||'-')}</b><br><span style="font-size:11px;color:#94a3b8">${esc(a.parent_seller_sku||'')}</span></td>
    <td>${esc(a.shop_account||'')}<br><span style="font-size:11px;color:#94a3b8">${esc(a.site_code||'')}</span></td>
    <td><span class="pri-mini" style="background:${pm.color}">${esc(P)}</span></td>
    <td style="font-size:12px">${esc(时限)}</td>
    <td><b>${pickScore(j) ?? '-'}</b></td>
    <td style="max-width:340px">${esc(j.headline||'-')}</td>
    <td><button class="mini-btn" onclick="goToAsin('${a.key}')">查看详情</button></td>
  </tr>`;
}

function goToAsin(key){
  closeBatch();
  const a = allAsins.find(x => x.key === key);
  const btn = document.querySelector(`#asin-list button[data-key='${CSS.escape(key)}']`);
  if (a) viewAsin(a, btn);
  btn && btn.scrollIntoView({behavior:'smooth', block:'center'});
}

async function runBatch(){
  const scope = document.getElementById('batch-scope').value;
  const limit = parseInt(document.getElementById('batch-limit').value);
  const conc = parseInt(document.getElementById('batch-conc').value);
  const list = pickBatch(scope, limit);
  renderBatchTable(list);
  const runBtn = document.getElementById('batch-run-btn');
  runBtn.disabled = true; runBtn.innerHTML = '<span class="spinner"></span> 判定中…';
  const prog = document.getElementById('batch-progress');
  const t0 = Date.now();
  let done = 0, failed = 0;
  const total = list.length;
  function updateProg(){
    const pct = total ? (done/total*100).toFixed(0) : 0;
    const elapsed = ((Date.now()-t0)/1000).toFixed(0);
    prog.innerHTML = `进度 ${done}/${total} · 失败 ${failed} · 已用 ${elapsed}s
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;
  }
  updateProg();

  const queue = list.slice();
  async function worker(){
    while (queue.length){
      const a = queue.shift();
      const tr = document.querySelector(`#batch-tbody tr[data-key='${CSS.escape(a.key)}']`);
      if (tr) tr.className = 'batch-row-running';
      try {
        // 用缓存
        let r = judgeCache.get(a.key)?.result;
        if (!r){
          const resp = await fetch('/api/judge/' + encodeURIComponent(a.key), {method:'POST'});
          if (!resp.ok) throw new Error('HTTP '+resp.status);
          r = await resp.json();
          if (!r.dry_run) judgeCache.set(a.key, {result: r, ts: Date.now()});
        }
        const j = r.judgment || {};
        if (tr) tr.outerHTML = rowHtml(a, j, 'done');
        renderAsins();  // 每完成一个就刷新左列排序
      } catch(e) {
        failed++;
        if (tr) { tr.className = 'batch-row-error'; tr.querySelector('td:nth-child(3)').setAttribute('colspan','4'); tr.innerHTML = `
          <td><b>${esc(a.parent_asin||'-')}</b></td>
          <td>${esc(a.shop_account||'')}</td>
          <td colspan="4">❌ ${esc(String(e))}</td>
          <td>-</td>`; }
      }
      done++;
      updateProg();
    }
  }
  await Promise.all(Array.from({length:conc}, worker));
  runBtn.disabled = false; runBtn.innerHTML = '▶ 重新运行';
  prog.innerHTML += ' · <b style="color:#059669">完成</b>';
}

function exportBatch(){
  const rows = [['ASIN','SKU','店铺','站点','优先级','时限','分数','结论','异常数','处理建议']];
  for (const a of allAsins){
    const cached = judgeCache.get(a.key);
    if (!cached) continue;
    const j = cached.result.judgment || {};
    const anoms = pickAnomalies(j);
    rows.push([
      a.parent_asin, a.parent_seller_sku, a.shop_account, a.site_code,
      pickPriority(j), j?.优先级信息?.处理时限, pickScore(j),
      (j.headline||'').replace(/,/g,'，'),
      anoms.length,
      anoms.map(x=>x.处理建议||'').join(' | ').replace(/,/g,'，'),
    ]);
  }
  const csv = '﻿' + rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `巡检批量结果_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

loadKb();
loadAsins();
</script>
